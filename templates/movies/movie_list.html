<!doctype html>

<html>
  <head>
    <title>Calypso Movies</title>
  </head>

  <body>
    <h1>Calypso Movies</h1>

    {% for movie in movies %}

    <h2>{{ movie.title }}</h2>

    <p>{{ movie.release_date }}</p>

    <p>Rating: {{ movie.vote_average }}</p>

    {% if movie.poster_path %}
    <img
      src="https://image.tmdb.org/t/p/w500{{ movie.poster_path }}"
      width="200"
    />
    {% endif %}

    <hr />

    {% empty %}

    <h2>No movies received from TMDB.</h2>

    {% endfor %}
  </body>
</html>
