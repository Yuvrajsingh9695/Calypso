<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify OTP - Calypso</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f0ff;
        }

        .box {
            width: 400px;
            max-width: 90%;
            margin: 100px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
        }

        p {
            text-align: center;
            color: #777;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
            text-align: center;
            font-size: 22px;
            letter-spacing: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: 0;
            border-radius: 8px;
            background: linear-gradient(135deg, #6A11CB, #2575FC);
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .message {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 7px;
            background: #eee;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Verify OTP</h2>

    <p>
        Enter the 6-digit OTP sent to your email.
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <input
            type="text"
            name="otp"
            maxlength="6"
            minlength="6"
            pattern="[0-9]{6}"
            inputmode="numeric"
            placeholder="000000"
            required
        >

        <button type="submit">
            Verify OTP
        </button>
    </form>

</div>

</body>
</html>
