<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Calypso</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f0ff;
        }

        .box {
            width: 400px;
            max-width: 90%;
            margin: 100px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 25px;
            border: 0;
            border-radius: 8px;
            background: linear-gradient(135deg, #6A11CB, #2575FC);
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .message {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 7px;
            background: #eee;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Create New Password</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>New Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter new password"
            required
        >

        <label>Confirm Password</label>

        <input
            type="password"
            name="confirm_password"
            placeholder="Confirm new password"
            required
        >

        <button type="submit">
            Change Password
        </button>
    </form>

</div>

</body>
</html>
