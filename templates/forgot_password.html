<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Calypso</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f0ff;
        }

        .box {
            width: 400px;
            max-width: 90%;
            margin: 100px auto;
            background: white;
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h2 {
            text-align: center;
            color: #2d2d2d;
        }

        p {
            text-align: center;
            color: #777;
        }

        label {
            display: block;
            margin: 20px 0 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            border: 0;
            border-radius: 8px;
            background: linear-gradient(135deg, #6A11CB, #2575FC);
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .message {
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 7px;
            background: #eee;
        }

        .back {
            text-align: center;
            margin-top: 20px;
        }

        .back a {
            color: #6A11CB;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Forgot Password?</h2>

    <p>
        Enter your registered email address.
    </p>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="POST">
        {% csrf_token %}

        <label>Email Address</label>

        <input
            type="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <button type="submit">
            Send OTP
        </button>
    </form>

    <div class="back">
        <a href="/users/login/">
            Back to Login
        </a>
    </div>

</div>

</body>
</html>
